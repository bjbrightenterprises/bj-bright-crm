<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F4B" />
      <stop offset="100%" stop-color="#071533" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bjGrad)" />

  <!-- Outer gold accent border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6" />

  <!-- Inner Badge Frame -->
  <circle cx="256" cy="230" r="140" fill="#11296B" filter="url(#shadow)" />
  <circle cx="256" cy="230" r="136" fill="none" stroke="#F5A623" stroke-width="6" stroke-dasharray="16 8" />

  <!-- BJ Monogram -->
  <text x="256" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="132" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">
    BJ
  </text>

  <!-- Golden Crown / Star Accent -->
  <path d="M 216 130 L 256 100 L 296 130 L 276 150 L 236 150 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="94" r="8" fill="#F5A623" />
  <circle cx="216" cy="124" r="6" fill="#F5A623" />
  <circle cx="296" cy="124" r="6" fill="#F5A623" />

  <!-- Subtitle -->
  <text x="256" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#F5A623" text-anchor="middle" letter-spacing="4">
    BJ BRIGHT
  </text>
  <text x="256" y="452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="#94A3B8" text-anchor="middle" letter-spacing="3">
    ENTERPRISES CRM
  </text>
</svg>
